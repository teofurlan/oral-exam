name: Feature request
description: Propose a new capability or a change to how Socra behaves.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check that an open or closed issue does not already cover it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on what the feature does.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: The problem it solves and who runs into it today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Tools, protocol messages, or UI behavior if you have them in mind.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes that mean the feature is done.
      placeholder: |
        - [ ] ...
        - [ ] Exam and agent modes remain available and unchanged.
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: Select every mode the feature touches.
      multiple: true
      options:
        - Exam mode (`/`)
        - Agent mode (`?mode=agent`)
        - A new mode
        - All modes / cross-cutting
        - Setup / install (shortcut, server start)

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select every area that seems involved.
      multiple: true
      options:
        - Speech-to-text (listening, transcription)
        - Text-to-speech (Socra speaking)
        - Visualizer
        - Code / content panel
        - Timeline / conversation UI
        - Permission requests (Allow / Deny)
        - Model or provider selection
        - MCP tools (open_page, ask, say, get_answer, finish)
        - Connection / server
        - Other

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this feature deliberately does not cover.

  - type: textarea
    id: related
    attributes:
      label: Dependencies and related issues
      description: Issues this depends on or relates to, for example `Depends on #12`.

  - type: textarea
    id: questions
    attributes:
      label: Open questions
      description: Decisions that are still open.
