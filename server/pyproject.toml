[project]
name = "socra-server"
version = "0.1.0"
description = "Local MCP + WebSocket server for Socra voice exams"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "websockets>=14.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "kokoro-onnx>=0.6.1",
    "faster-whisper>=1.0",
]

[project.scripts]
socra-server = "socra_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socra_server"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "anyio>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
